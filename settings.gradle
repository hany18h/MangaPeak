pluginManagement {
	repositories {
		google {
			content {
				includeGroupByRegex("com\\.android.*")
				includeGroupByRegex("com\\.google.*")
				includeGroupByRegex("androidx.*")
			}
		}
		mavenCentral()
		gradlePluginPortal()
		maven {
			url 'https://jitpack.io'
			content {
				includeGroupByRegex("com\\.github.*")
			}
		}
	}
}
dependencyResolutionManagement {
	repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
	repositories {
		google()
		mavenCentral()
		maven {
			url 'https://jitpack.io'
		}
	}
}

include ':app'
rootProject.name = "MangaPeak"

// Resolve the pinned parser revision from JitPack by default. Developers can
// opt into the bundled checkout with -PuseLocalParsers=true.
def localParsers = file('kotatsu-parsers')
def useLocalParsers = providers.gradleProperty('useLocalParsers')
	.orElse('false')
	.get()
	.toBoolean()
if (useLocalParsers && localParsers.isDirectory()) {
	includeBuild(localParsers) {
		dependencySubstitution {
			substitute module('com.github.hany18h:kotatsu-parsers') using project(':')
		}
	}
}
